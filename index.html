<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Boutique d’essai · Rapport des ventes</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;background:#f6f6f4;color:#1c1c1a;margin:0;display:flex;justify-content:center;padding:48px 16px}
main{background:#fff;border:1px solid #e4e4e0;border-radius:12px;padding:32px;max-width:440px;width:100%}
h1{font-size:20px;margin:0 0 8px}p{color:#5c5c58;margin:0 0 20px}
label{display:block;font-size:13px;margin:0 0 6px;color:#3c3c38}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d4d4d0;border-radius:8px;margin:0 0 16px;font-size:15px}
button{background:#1c1c1a;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 0;border-bottom:1px solid #eee}
.erreur{color:#b42318}
</style>
</head>
<body>
<main id="page">
<section id="connexion">
<h1>Connexion</h1>
<p>Connecte-toi pour voir le rapport des ventes.</p>
<form id="formulaire">
<label for="identifiant">Identifiant</label>
<input id="identifiant" name="identifiant" autocomplete="username">
<label for="mdp">Mot de passe</label>
<input id="mdp" name="mdp" type="password" autocomplete="current-password">
<p id="erreur" class="erreur" hidden>Identifiant ou mot de passe incorrect.</p>
<button type="submit">Se connecter</button>
</form>
</section>
<section id="rapport" hidden>
<h1>Rapport des ventes · octobre 2026</h1>
<p>Boutique d’essai, données fictives.</p>
<table>
<tr><th>Produit</th><th>Ventes</th></tr>
<tr><td>Carnet de notes</td><td>1 240 €</td></tr>
<tr><td>Stylo plume</td><td>860 €</td></tr>
<tr><td>Agenda 2027</td><td>2 150 €</td></tr>
<tr><th>Total</th><th>4 250 €</th></tr>
</table>
<p style="margin-top:20px">Meilleure vente : Agenda 2027.</p>
</section>
</main>
<script>
const montrer=()=>{connexion.hidden=true;rapport.hidden=false};
if(document.cookie.split('; ').includes('essai=ok'))montrer();
formulaire.addEventListener('submit',e=>{e.preventDefault();
if(identifiant.value==='essai'&&mdp.value==='essai-1234'){document.cookie='essai=ok; path=/; max-age=86400; secure; samesite=lax';montrer()}else{erreur.hidden=false}});
</script>
</body>
</html>
